name: DataCo backend and map checks

on:
  pull_request:
    paths:
      - "src/dataco*.py"
      - "src/rag*.py"
      - "src/intent_router.py"
      - "src/tool_schemas.py"
      - "knowledge_base/**"
      - "requirements*.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "README*.md"
      - "templates/rag.html"
      - "src/api.py"
      - "src/providers.py"
      - "src/dataset_registry.py"
      - "templates/dataco_map.html"
      - "templates/index.html"
      - "tests/**"
      - ".github/workflows/dataco-backend-tests.yml"
  push:
    branches:
      - feature/dataco-agent-country-map

jobs:
  dataco-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip duckdb pandas joblib
      - name: Install and verify RAG dependencies
        run: |
          python -m pip install "langchain-core>=1.0,<2.0" "langchain-text-splitters>=1.0,<2.0" "langchain-qdrant>=1.1,<2.0" "fastembed>=0.7,<1.0" "qdrant-client>=1.15,<2.0" "pypdf>=5,<7"
          python -c "from fastembed import TextEmbedding; from langchain_core.embeddings import Embeddings; from langchain_text_splitters import RecursiveCharacterTextSplitter; from langchain_qdrant import QdrantVectorStore; from qdrant_client import QdrantClient; print('RAG dependencies import OK')"
      - name: Compile Python source
        run: python -m compileall -q src tests
      - name: Check DataCo map JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("templates/dataco_map.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.DOTALL | re.IGNORECASE)
          inline = [script for script in scripts if script.strip()]
          if not inline:
              raise SystemExit("No inline JavaScript found in templates/dataco_map.html")
          Path("/tmp/dataco_map_inline.js").write_text(inline[-1], encoding="utf-8")
          PY
          node --check /tmp/dataco_map_inline.js
      - name: Test DataCo dataset and country map
        run: python -m unittest discover -s tests -p "test_dataco_map.py" -v
      - name: Test RAG validation, safe source selection, and abstention
        run: python -m unittest discover -s tests -p "test_rag.py" -v
      - name: Test hybrid intent routing
        run: python -m unittest discover -s tests -p "test_intent_router.py" -v
      - name: Test runtime router and tool filtering
        run: python -m unittest discover -s tests -p "test_model_router_intents.py" -v
      - name: Test RAG README Docker context
        run: python -m unittest discover -s tests -p "test_rag_docker_context.py" -v
