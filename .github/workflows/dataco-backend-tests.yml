name: DataCo backend and map checks

on:
  pull_request:
    paths:
      - "src/dataco*.py"
      - "src/api.py"
      - "src/providers.py"
      - "src/dataset_registry.py"
      - "templates/dataco_map.html"
      - "templates/index.html"
      - "tests/**"
      - ".github/workflows/dataco-backend-tests.yml"
  push:
    branches:
      - feature/dataco-agent-country-map

jobs:
  dataco-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip duckdb pandas
      - name: Compile Python source
        run: python -m compileall -q src tests
      - name: Test DataCo dataset and country map
        run: python -m unittest discover -s tests -p "test_dataco_map.py" -v
