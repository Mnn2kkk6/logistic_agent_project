<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logistics Knowledge Assistant · RAG</title>
  <style>
    :root { color-scheme: light; --ink:#182230; --muted:#64748b; --line:#dbe3ec; --panel:#f7f9fc; --accent:#2457c5; }
    * { box-sizing:border-box; }
    body { margin:0; background:#f3f6fa; color:var(--ink); font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif; }
    main { max-width:900px; margin:40px auto; padding:0 18px 48px; }
    header, .panel, .source { background:white; border:1px solid var(--line); border-radius:16px; padding:22px; }
    header { margin-bottom:18px; }
    h1 { margin:0 0 8px; font-size:clamp(24px,4vw,34px); }
    h2 { font-size:18px; margin:0 0 12px; }
    p { margin:8px 0; }
    .muted, #status { color:var(--muted); font-size:14px; }
    form { display:grid; gap:12px; }
    textarea { width:100%; min-height:120px; resize:vertical; padding:13px; border:1px solid #cbd5e1; border-radius:10px; font:inherit; }
    .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    select, button { font:inherit; border-radius:9px; padding:10px 14px; }
    select { border:1px solid #cbd5e1; background:white; }
    button { background:var(--accent); color:white; border:0; cursor:pointer; font-weight:650; }
    button:disabled { opacity:.55; cursor:wait; }
    #answer { white-space:pre-wrap; }
    #sources { display:grid; gap:10px; margin-top:12px; }
    .source { padding:14px 16px; border-radius:11px; }
    .source strong { overflow-wrap:anywhere; }
    .excerpt { color:#475569; font-size:14px; margin-top:6px; white-space:pre-wrap; }
    .notice { border-left:4px solid #d97706; padding:8px 12px; background:#fffbeb; color:#78350f; border-radius:4px; font-size:14px; }
    a { color:var(--accent); }
  </style>
</head>
<body>
<main>
  <header>
    <p><a href="/">← Back to AI Logistics Agent</a></p>
    <h1>Logistics Knowledge Assistant</h1>
    <p>Tra cứu tài liệu bằng RAG (LangChain + Qdrant), trả lời dựa trên nội dung đã truy xuất và hiển thị nguồn để kiểm chứng.</p>
    <p id="status">Đang kiểm tra kho tri thức…</p>
  </header>
  <section class="panel">
    <form id="ask-form">
      <label for="question"><strong>Câu hỏi của bạn</strong></label>
      <textarea id="question" maxlength="2000" required placeholder="Ví dụ: Trường late_delivery_risk có phải là xác suất dự đoán bởi model không?"></textarea>
      <div class="controls">
        <label for="top-k">Số đoạn nguồn</label>
        <select id="top-k">
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="8">8</option>
        </select>
        <button id="submit" type="submit">Hỏi tài liệu</button>
        <span id="feedback" class="muted"></span>
      </div>
    </form>
  </section>
  <section class="panel" style="margin-top:18px">
    <h2>Câu trả lời</h2>
    <div id="answer" class="muted">Câu trả lời sẽ hiển thị ở đây.</div>
    <div id="notice"></div>
    <h2 style="margin-top:22px">Nguồn được truy xuất</h2>
    <div id="sources" class="muted">Chưa có nguồn.</div>
  </section>
</main>
<script>
(function () {
  const statusNode = document.getElementById("status");
  const form = document.getElementById("ask-form");
  const submit = document.getElementById("submit");
  const feedback = document.getElementById("feedback");
  const answer = document.getElementById("answer");
  const sourcesNode = document.getElementById("sources");
  const notice = document.getElementById("notice");

  async function updateStatus() {
    try {
      const response = await fetch("/api/v1/rag/status");
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Không kiểm tra được kho tri thức.");
      statusNode.textContent = data.indexed
        ? "Kho tri thức sẵn sàng · " + data.points_count + " chunks · " + data.qdrant_backend
        : "Kho tri thức chưa được nạp. Hãy chạy lệnh ingest trong README.";
    } catch (error) {
      statusNode.textContent = "RAG chưa sẵn sàng: " + error.message;
    }
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    submit.disabled = true;
    feedback.textContent = "Đang truy xuất và tổng hợp…";
    answer.textContent = "";
    sourcesNode.textContent = "";
    notice.textContent = "";
    try {
      const response = await fetch("/api/v1/rag/query", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          question: document.getElementById("question").value,
          top_k: Number(document.getElementById("top-k").value)
        })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Yêu cầu thất bại.");
      answer.textContent = data.answer;
      if (data.abstained) {
        const p = document.createElement("p");
        p.className = "notice";
        p.textContent = "Không tìm thấy đủ bằng chứng. Câu trả lời được chủ động từ chối thay vì suy đoán.";
        notice.appendChild(p);
      }
      if (Array.isArray(data.sources) && data.sources.length) {
        data.sources.forEach(function (source) {
          const card = document.createElement("article");
          card.className = "source";
          const title = document.createElement("strong");
          title.textContent = "[" + source.id + "] " + source.source;
          card.appendChild(title);
          const score = document.createElement("div");
          score.className = "muted";
          score.textContent = "Similarity score: " + source.score;
          card.appendChild(score);
          const excerpt = document.createElement("div");
          excerpt.className = "excerpt";
          excerpt.textContent = source.excerpt || "";
          card.appendChild(excerpt);
          sourcesNode.appendChild(card);
        });
      } else {
        sourcesNode.textContent = "Không có nguồn phù hợp.";
      }
      feedback.textContent = "Hoàn tất.";
    } catch (error) {
      answer.textContent = "Không thể xử lý câu hỏi.";
      sourcesNode.textContent = "";
      feedback.textContent = error.message;
    } finally {
      submit.disabled = false;
    }
  });
  updateStatus();
})();
</script>
</body>
</html>
